<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Player IPTV</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .layer-gpu {
            transform: translateZ(0);
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .hidden { display: none !important; }

        /* TELA DE LOGIN */
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            contain: content;
        }

        .logo { max-width: 120px; height: auto; margin-bottom: 15px; }

        .id-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 1.1em;
        }

        button {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            touch-action: manipulation;
        }

        .btn-copy { background-color: #333333; width: auto; padding: 6px 12px; font-size: 0.9em; }

        /* PAINEL PRINCIPAL IPTV */
        #mainScreen {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0d0d0d;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1a1a1a;
            padding: 10px 20px;
            border-bottom: 1px solid #2a2a2a;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header .logo { max-width: 60px; margin-bottom: 0; }

        /* MENU DE NAVEGAÇÃO */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            background-color: #141414;
            padding: 10px;
            border-bottom: 1px solid #222;
        }

        .tab-btn {
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 20px;
            width: auto;
            font-size: 0.95em;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }

        /* ÁREA DE CONTEÚDO */
        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* CATEGORIAS */
        .sidebar {
            width: 240px;
            background-color: #121212;
            border-right: 1px solid #222;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px;
        }

        .cat-item {
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #ccc;
            font-size: 0.9em;
            margin-bottom: 4px;
        }

        .cat-item:hover, .cat-item.active {
            background-color: #222;
            color: #007bff;
            font-weight: bold;
        }

        /* GRID DE MÍDIA */
        .media-grid {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .media-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
        }

        .media-card:hover { transform: scale(1.03); }

        .media-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background-color: #222;
            display: block;
        }

        .media-card .title {
            padding: 8px;
            font-size: 0.8em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* PLAYER DE VÍDEO OVERLAY */
        #playerModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-close {
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-suporte {
            position: fixed;
            bottom: calc(15px + env(safe-area-inset-bottom));
            right: calc(15px + env(safe-area-inset-right));
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            z-index: 999;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="container layer-gpu" id="loginScreen">
    <img src="logo_gg.png" alt="Logo GG" class="logo" loading="eager" decoding="async">
    <h2>Acesso ao Player</h2>
    <p>Seu ID do dispositivo:</p>
    
    <div class="id-box">
        <span id="deviceId">Carregando...</span>
        <button class="btn-copy" id="btnCopiar">Copiar</button>
    </div>

    <button id="btnEntrar">Entrar</button>
</div>

<!-- TELA PRINCIPAL IPTV -->
<div id="mainScreen" class="hidden layer-gpu">
    <div class="header">
        <div class="header-left">
            <img src="logo_gg.png" alt="Logo GG" class="logo">
            <span style="font-weight: bold;">GG Player</span>
        </div>
        <span id="userInfo" style="font-size: 0.85em; color: #888;">ID Conectado</span>
    </div>

    <!-- ABAS PRINCIPAIS -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="carregarAba('tv')">📺 TV ao Vivo</button>
        <button class="tab-btn" onclick="carregarAba('filmes')">🎬 Filmes</button>
        <button class="tab-btn" onclick="carregarAba('series')">🍿 Séries</button>
    </div>

    <!-- ÁREA DE NAVEGAÇÃO -->
    <div class="content-area">
        <div class="sidebar" id="categoryList">
            <!-- Categorias dinâmicas aqui -->
        </div>
        <div class="media-grid" id="mediaGrid">
            <!-- Cards de filmes/canais aqui -->
        </div>
    </div>
</div>

<!-- PLAYER REPRODUTOR -->
<div id="playerModal" class="hidden">
    <div class="player-header">
        <span id="playerTitle">Reproduzindo</span>
        <button class="btn-close" onclick="fecharPlayer()">✕</button>
    </div>
    <video id="mediaPlayer" controls playsinline webkit-playsinline preload="metadata"></video>
</div>

<a href="https://wa.me/5584998457394?text=Olá,%20preciso%20de%20suporte%20com%20o%20Web%20Player." target="_blank" class="btn-suporte layer-gpu">
    💬 Suporte
</a>

<script>
    'use strict';

    let currentID = "";
    const loginScreen = document.getElementById("loginScreen");
    const mainScreen = document.getElementById("mainScreen");
    const playerModal = document.getElementById("playerModal");
    const mediaPlayer = document.getElementById("mediaPlayer");

    // Dados Exemplo de Estrutura IPTV
    const dadosIPTV = {
        tv: {
            categorias: ["Abertos", "Esportes", "Filmes e Séries"],
            itens: [
                { titulo: "Canal Exemplo 1", capa: "", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", cat: "Abertos" },
                { titulo: "Canal Esporte 24h", capa: "", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4", cat: "Esportes" }
            ]
        },
        filmes: {
            categorias: ["Ação", "Comédia", "Lançamentos"],
            itens: [
                { titulo: "Filme Demonstração", capa: "https://via.placeholder.com/150x225?text=Filme", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", cat: "Ação" }
            ]
        },
        series: {
            categorias: ["Drama", "Animes"],
            itens: [
                { titulo: "Série Exemplo Ep 1", capa: "https://via.placeholder.com/150x225?text=Serie", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", cat: "Drama" }
            ]
        }
    };

    let abaAtual = 'tv';

    function obterIDLocal() { return localStorage.getItem("device_id"); }
    function salvarIDLocal(id) { localStorage.setItem("device_id", id); }

    function inicializarID() {
        currentID = obterIDLocal();
        if (!currentID) {
            currentID = "GG-" + Math.random().toString(36).substring(2, 9).toUpperCase();
            salvarIDLocal(currentID);
        }
        document.getElementById("deviceId").textContent = currentID;
    }

    function copiarID() {
        navigator.clipboard.writeText(currentID).then(() => alert("ID copiado!"));
    }

    function verificarEAbrir() {
        loginScreen.classList.add("hidden");
        mainScreen.classList.remove("hidden");
        carregarAba('tv');
    }

    function carregarAba(tipo) {
        abaAtual = tipo;
        
        // Atualiza abas visuais
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Carrega Categorias
        const sidebar = document.getElementById("categoryList");
        sidebar.innerHTML = `<div class="cat-item active" onclick="filtrarCategoria('todas')">Todas as Categorias</div>`;
        
        dadosIPTV[tipo].categorias.forEach(cat => {
            sidebar.innerHTML += `<div class="cat-item" onclick="filtrarCategoria('${cat}')">${cat}</div>`;
        });

        renderizarItens(dadosIPTV[tipo].itens);
    }

    function renderizarItens(itens) {
        const grid = document.getElementById("mediaGrid");
        grid.innerHTML = "";

        itens.forEach(item => {
            const capa = item.capa || "https://via.placeholder.com/150x225?text=Sem+Capa";
            grid.innerHTML += `
                <div class="media-card" onclick="abrirPlayer('${item.titulo}', '${item.url}')">
                    <img src="${capa}" alt="${item.titulo}" loading="lazy">
                    <div class="title">${item.titulo}</div>
                </div>
            `;
        });
    }

    function filtrarCategoria(cat) {
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        event.target.classList.add('active');

        if (cat === 'todas') {
            renderizarItens(dadosIPTV[abaAtual].itens);
        } else {
            const filtrados = dadosIPTV[abaAtual].itens.filter(i => i.cat === cat);
            renderizarItens(filtrados);
        }
    }

    function abrirPlayer(titulo, url) {
        document.getElementById("playerTitle").textContent = titulo;
        mediaPlayer.src = url;
        playerModal.classList.remove("hidden");
        mediaPlayer.play();
    }

    function fecharPlayer() {
        mediaPlayer.pause();
        mediaPlayer.removeAttribute("src");
        playerModal.classList.add("hidden");
    }

    document.getElementById("btnCopiar").addEventListener("click", copiarID);
    document.getElementById("btnEntrar").addEventListener("click", verificarEAbrir);

    inicializarID();
</script>

</body>
</html>
