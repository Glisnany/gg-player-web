<script>
    'use strict';

    // ==========================================
    // CONFIGURAÇÃO DO FIREBASE
    // ==========================================
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_PROJECT_ID.firebaseapp.com",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_PROJECT_ID.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ==========================================
    // ESTADO GLOBAL
    // ==========================================
    let currentID = "";
    let hlsInstance = null;
    let abaAtual = 'tv';
    let playlistData = { tv: [], filmes: [], series: [] };

    const loginScreen = document.getElementById("loginScreen");
    const mainScreen = document.getElementById("mainScreen");
    const statusMsg = document.getElementById("statusMsg");
    const mediaPlayer = document.getElementById("mediaPlayer");
    const playerModal = document.getElementById("playerModal");

    function isAdult(name) {
        if (!name) return false;
        return /(XXX|18\+|PORN|ADULTO|SEXX)/i.test(name);
    }

    function obterIDLocal() { return localStorage.getItem("device_id"); }
    function salvarIDLocal(id) { localStorage.setItem("device_id", id); }

    function inicializarID() {
        currentID = obterIDLocal();
        if (!currentID) {
            currentID = "GG-" + Math.random().toString(36).substring(2, 9).toUpperCase();
            salvarIDLocal(currentID);
        }
        document.getElementById("deviceId").textContent = currentID;
    }

    // ==========================================
    // LEITURA DO FIREBASE & M3U PARSER
    // ==========================================
    async function iniciarConexao() {
        statusMsg.textContent = "Verificando autorização...";
        console.log("Iniciando verificação para o ID:", currentID);

        try {
            const docRef = db.collection("devices").doc(currentID);
            const docSnap = await docRef.get();

            if (!docSnap.exists) {
                console.log("Documento não existe. Criando documento pendente...");
                await docRef.set({ 
                    authorized: false, 
                    fixed_url: "",
                    mode: "fixed" 
                }, { merge: true });
                statusMsg.textContent = "ID pendente de ativação no painel.";
                return;
            }

            const data = docSnap.data();
            console.log("Dados retornados do Firestore:", data);

            // Validação explícita dos campos
            if (data.authorized !== true) {
                statusMsg.textContent = "ID pendente de ativação (authorized=false).";
                return;
            }

            // Garante leitura flexível do modo ("fixed" ou "FIXED")
            const mode = (data.mode || "").toLowerCase();
            if (mode !== "fixed") {
                statusMsg.textContent = `Modo '${data.mode}' não suportado. Altere para 'fixed'.`;
                return;
            }

            const m3uUrl = data.fixed_url ? data.fixed_url.trim() : "";
            if (!m3uUrl) {
                statusMsg.textContent = "Campo fixed_url está vazio no Firebase.";
                return;
            }

            statusMsg.textContent = "Carregando lista M3U...";
            console.log("Baixando M3U de:", m3uUrl);

            // Download da lista com suporte a CORS
            const res = await fetch(m3uUrl);
            if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
            
            const m3uText = await res.text();
            parseM3U(m3uText);

            statusMsg.textContent = "Lista carregada!";
            loginScreen.classList.add("hidden");
            mainScreen.classList.remove("hidden");
            carregarAba('tv');

        } catch (error) {
            console.error("Erro na conexão:", error);
            statusMsg.textContent = "Erro de conexão/CORS ao baixar a lista ou acessar o Firebase.";
        }
    }

    function parseM3U(content) {
        playlistData = { tv: [], filmes: [], series: [] };
        const lines = content.split('\n');
        let currentItem = null;

        for (let line of lines) {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',')[1] || "Sem Nome";
                const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                const groupMatch = line.match(/group-title="([^"]+)"/);

                currentItem = {
                    name: name.trim(),
                    logo: logoMatch ? logoMatch[1] : "",
                    group: groupMatch ? groupMatch[1] : "Geral"
                };
            } else if (line.startsWith('http://') || line.startsWith('https://')) {
                if (currentItem) {
                    currentItem.url = line;
                    const groupUpper = currentItem.group.toUpperCase();

                    if (groupUpper.includes("FILME") || groupUpper.includes("VOD") || line.includes("/movie/")) {
                        playlistData.filmes.push(currentItem);
                    } else if (groupUpper.includes("SERIE") || line.includes("/series/")) {
                        playlistData.series.push(currentItem);
                    } else {
                        playlistData.tv.push(currentItem);
                    }
                    currentItem = null;
                }
            }
        }
    }

    // ==========================================
    // INTERFACE DE NAVEGAÇÃO
    // ==========================================
    function carregarAba(tipo) {
        abaAtual = tipo;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');

        const sidebar = document.getElementById("categoryList");
        sidebar.innerHTML = `<div class="cat-item active" onclick="filtrarCategoria('todas')">Todas as Categorias</div>`;

        const grupos = [...new Set(playlistData[tipo].map(i => i.group))];
        grupos.forEach(grp => {
            if (!isAdult(grp)) {
                sidebar.innerHTML += `<div class="cat-item" onclick="filtrarCategoria('${grp.replace(/'/g, "\\'")}')">${grp}</div>`;
            }
        });

        filtrarCategoria('todas');
    }

    function filtrarCategoria(grupo) {
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');

        const grid = document.getElementById("mediaGrid");
        grid.innerHTML = "";

        const itens = playlistData[abaAtual].filter(i => {
            if (isAdult(i.name) || isAdult(i.group)) return false;
            return grupo === 'todas' || i.group === grupo;
        });

        itens.forEach(item => {
            const logo = item.logo || "https://via.placeholder.com/150x225?text=Sem+Capa";
            grid.innerHTML += `
                <div class="media-card" onclick="reproduzirMidia('${item.url}', '${item.name.replace(/'/g, "\\'")}')">
                    <img src="${logo}" alt="${item.name}" loading="lazy">
                    <div class="title">${item.name}</div>
                </div>
            `;
        });
    }

    // ==========================================
    // REPRODUTOR DE VÍDEO
    // ==========================================
    function reproduzirMidia(url, titulo) {
        document.getElementById("playerTitle").textContent = titulo;
        playerModal.classList.remove("hidden");

        if (url.includes(".m3u8") || url.includes("/live/")) {
            if (Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls({ maxBufferLength: 30 });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(mediaPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => mediaPlayer.play());
            } else if (mediaPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                mediaPlayer.src = url;
                mediaPlayer.play();
            }
        } else {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            mediaPlayer.src = url;
            mediaPlayer.play();
        }
    }

    function fecharPlayer() {
        if (hlsInstance) {
            hlsInstance.destroy();
            hlsInstance = null;
        }
        mediaPlayer.pause();
        mediaPlayer.removeAttribute("src");
        playerModal.classList.add("hidden");
    }

    document.getElementById("btnCopiar").addEventListener("click", () => {
        navigator.clipboard.writeText(currentID).then(() => alert("ID copiado!"));
    });
    document.getElementById("btnEntrar").addEventListener("click", iniciarConexao);

    inicializarID();
</script>
