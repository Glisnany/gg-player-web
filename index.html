<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Player Web</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%; }
        .id-box { background: #2a2a2a; padding: 10px; border-radius: 5px; margin: 15px 0; font-family: monospace; }
        button { background: #007bff; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .hidden { display: none !important; }
        #mainScreen { width: 100%; height: 100vh; display: flex; flex-direction: column; background: #0d0d0d; }
        .nav-tabs { display: flex; justify-content: center; gap: 10px; padding: 10px; background: #141414; }
        .tab-btn { background: #222; color: #aaa; border: none; padding: 8px 16px; border-radius: 15px; cursor: pointer; }
        .tab-btn.active { background: #007bff; color: #fff; }
        .content { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 220px; background: #121212; overflow-y: auto; padding: 10px; }
        .cat-item { padding: 10px; cursor: pointer; color: #ccc; border-bottom: 1px solid #1a1a1a; font-size: 0.9em; }
        .cat-item.active { color: #007bff; font-weight: bold; background: #1a1a1a; }
        .grid { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .card { background: #1a1a1a; border-radius: 5px; text-align: center; cursor: pointer; padding: 8px; }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; }
        .card .title { font-size: 0.8em; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #playerModal { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; }
        .player-head { padding: 10px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.7); }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div class="container" id="loginScreen">
    <h2>GG Player Web</h2>
    <p>Seu ID:</p>
    <div class="id-box" id="deviceId">Carregando...</div>
    <button id="btnEntrar">Entrar</button>
    <p id="statusMsg" style="color: #ff9800; font-size: 0.9em;"></p>
</div>

<div id="mainScreen" class="hidden">
    <div class="nav-tabs">
        <button class="tab-btn active" id="btn-tv" onclick="carregarAba('tv')">📺 TV</button>
        <button class="tab-btn" id="btn-filmes" onclick="carregarAba('filmes')">🎬 Filmes</button>
        <button class="tab-btn" id="btn-series" onclick="carregarAba('series')">🍿 Séries</button>
    </div>
    <div class="content">
        <div class="sidebar" id="categoryList"></div>
        <div class="grid" id="mediaGrid"></div>
    </div>
</div>

<div id="playerModal" class="hidden">
    <div class="player-head">
        <span id="playerTitle"></span>
        <button onclick="fecharPlayer()" style="width:auto;">✕ Fechar</button>
    </div>
    <video id="mediaPlayer" controls autoplay></video>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC06Bn7C-llo0B0vIfE7Nxq5vkEhBk2U-w",
        authDomain: "gg-gestao.firebaseapp.com",
        projectId: "gg-gestao",
        storageBucket: "gg-gestao.firebasestorage.app",
        messagingSenderId: "499414114342",
        appId: "1:499414114342:web:8d8b9e4f89fff9179706e7"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentID = localStorage.getItem("device_id") || "GG-" + Math.random().toString(36).substring(2, 9).toUpperCase();
    localStorage.setItem("device_id", currentID);
    document.getElementById("deviceId").textContent = currentID;

    let playlist = { tv: [], filmes: [], series: [] };
    let abaAtual = 'tv';
    let hls = null;

    document.getElementById("btnEntrar").onclick = async () => {
        const status = document.getElementById("statusMsg");
        status.textContent = "Conectando ao Firebase...";

        try {
            const doc = await db.collection("devices").doc(currentID).get();
            if (!doc.exists) return status.textContent = "ID não cadastrado no painel.";
            
            const data = doc.data();
            if (!data.authorized) return status.textContent = "Dispositivo não autorizado.";
            if (!data.fixed_url) return status.textContent = "Sem URL cadastrada.";

            status.textContent = "Baixando e processando lista...";
            
            const linkProxy = "proxy.php?url=" + encodeURIComponent(data.fixed_url.trim());
            
            const res = await fetch(linkProxy);
            if (!res.ok) throw new Error();
            const text = await res.text();

            parseM3U(text);
            
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("mainScreen").classList.remove("hidden");
            carregarAba('tv');
        } catch (e) {
            status.textContent = "Erro ao ler a lista M3U. Verifique se o proxy.php está rodando.";
        }
    };

    function parseM3U(content) {
        playlist = { tv: [], filmes: [], series: [] };
        
        // Trata quebras de linha tanto \r\n (Windows) quanto \n (Linux/Mac)
        const lines = content.replace(/\r/g, '').split('\n');
        let currentItem = null;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            if (line.startsWith('#EXTINF:')) {
                const nameParts = line.split(',');
                const name = nameParts.length > 1 ? nameParts.slice(1).join(',').trim() : "Sem Nome";
                
                const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                const logo = logoMatch ? logoMatch[1] : "";

                const groupMatch = line.match(/group-title="([^"]+)"/i);
                const group = groupMatch ? groupMatch[1] : "Geral";

                currentItem = { name, logo, group };
            } else if (line.startsWith('http') && currentItem) {
                currentItem.url = line;
                const g = currentItem.group.toUpperCase();
                const u = line.toLowerCase();

                if (g.includes("FILME") || u.includes("/movie/")) {
                    playlist.filmes.push(currentItem);
                } else if (g.includes("SERIE") || u.includes("/series/")) {
                    playlist.series.push(currentItem);
                } else {
                    playlist.tv.push(currentItem);
                }
                currentItem = null;
            }
        }
    }

    function carregarAba(tipo) {
        abaAtual = tipo;
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${tipo}`).classList.add('active');

        const side = document.getElementById("categoryList");
        side.innerHTML = "";

        const allBtn = document.createElement("div");
        allBtn.className = "cat-item active";
        allBtn.textContent = "Todas";
        allBtn.onclick = () => {
            document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
            allBtn.classList.add('active');
            filtrar('');
        };
        side.appendChild(allBtn);

        const grupos = [...new Set(playlist[tipo].map(i => i.group))];
        
        grupos.forEach(g => {
            const catBtn = document.createElement("div");
            catBtn.className = "cat-item";
            catBtn.textContent = g;
            catBtn.onclick = () => {
                document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
                catBtn.classList.add('active');
                filtrar(g);
            };
            side.appendChild(catBtn);
        });

        filtrar('');
    }

    function filtrar(grp) {
        const grid = document.getElementById("mediaGrid");
        grid.innerHTML = "";
        
        const lista = grp ? playlist[abaAtual].filter(i => i.group === grp) : playlist[abaAtual];
        
        if (lista.length === 0) {
            grid.innerHTML = "<p style='color: #888; padding: 20px;'>Nenhum item encontrado nesta categoria.</p>";
            return;
        }

        lista.forEach(i => {
            const card = document.createElement("div");
            card.className = "card";
            
            const img = document.createElement("img");
            img.src = i.logo || 'https://via.placeholder.com/130x140?text=Sem+Capa';
            img.onerror = () => { img.src = 'https://via.placeholder.com/130x140?text=Sem+Capa'; };
            
            const title = document.createElement("div");
            title.className = "title";
            title.textContent = i.name;

            card.appendChild(img);
            card.appendChild(title);
            card.onclick = () => play(i.url, i.name);

            grid.appendChild(card);
        });
    }

    function play(url, titulo) {
        document.getElementById("playerTitle").textContent = titulo;
        document.getElementById("playerModal").classList.remove("hidden");
        const video = document.getElementById("mediaPlayer");

        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        } else if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = url;
            video.play();
        }
    }

    function fecharPlayer() {
        if (hls) hls.destroy();
        const video = document.getElementById("mediaPlayer");
        video.pause();
        video.src = "";
        document.getElementById("playerModal").classList.add("hidden");
    }
</script>
</body>
</html>
