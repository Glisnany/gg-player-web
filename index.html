<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        .logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 15px;
        }
        .id-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 1.1em;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-copy {
            background-color: #333;
            padding: 6px 12px;
            font-size: 0.9em;
        }
        .btn-copy:hover {
            background-color: #555;
        }
        /* Tela Principal de Navegação (Escondida por padrão) */
        #mainScreen {
            display: none;
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1e1e1e;
            padding: 10px 20px;
            border-radius: 8px;
        }
        .header .logo {
            max-width: 80px;
            margin-bottom: 0;
        }
        /* Botão de Suporte Discreto no Rodapé */
        .btn-suporte {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        .btn-suporte:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

<!-- TELA DE LOGIN / ID -->
<div class="container" id="loginScreen">
    <img src="logo_gg.png" alt="Logo GG" class="logo">
    <h2>Acesso ao Player</h2>
    <p>Seu ID do dispositivo:</p>
    
    <div class="id-box">
        <span id="deviceId">Carregando...</span>
        <button class="btn-copy" onclick="copiarID()">Copiar</button>
    </div>

    <button id="btnEntrar" onclick="verificarAcesso()">Entrar</button>
</div>

<!-- TELA PRINCIPAL DE NAVEGAÇÃO -->
<div id="mainScreen">
    <div class="header">
        <img src="logo_gg.png" alt="Logo GG" class="logo">
        <h2>Painel Principal</h2>
    </div>
    <div style="margin-top: 40px; text-align: center;">
        <p>Bem-vindo ao Player! Conteúdo da navegação aqui.</p>
    </div>
</div>

<!-- SUPORTE WHATSAPP (FIXO E DISCRETO) -->
<a href="https://wa.me/5584998457394?text=Olá,%20preciso%20de%20suporte%20com%20o%20Web%20Player." target="_blank" class="btn-suporte">
    💬 Suporte
</a>

<script>
    function obterOuGerarID() {
        let id = localStorage.getItem("device_id");
        if (!id) {
            id = "GG-" + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem("device_id", id);
        }
        return id;
    }

    const deviceId = obterOuGerarID();
    document.getElementById("deviceId").innerText = deviceId;

    function copiarID() {
        navigator.clipboard.writeText(deviceId).then(() => {
            alert("ID copiado para a área de transferência!");
        });
    }

    function verificarAcesso() {
        // Exemplo: Simula acesso permitido e transição para a tela principal
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("mainScreen").style.display = "block";
    }
</script>

</body>
</html>
