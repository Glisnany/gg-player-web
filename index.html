<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GG Player Web</title>
    
    <!-- Hls.js para suporte otimizado a streaming HLS (.m3u8) no iOS Safari/Windows -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .layer-gpu {
            transform: translateZ(0);
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .hidden { display: none !important; }

        /* TELA DE LOGIN / STATUS */
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            contain: content;
        }

        .logo { max-width: 120px; height: auto; margin-bottom: 15px; }

        .id-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 1.1em;
        }

        button {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            touch-action: manipulation;
        }

        button:hover { background-color: #0056b3; }
        .btn-copy { background-color: #333333; width: auto; padding: 6px 12px; font-size: 0.9em; }

        .status-msg {
            margin-top: 15px;
            font-size: 0.9em;
            color: #ff9800;
        }

        /* TELA PRINCIPAL IPTV */
        #mainScreen {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0d0d0d;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1a1a1a;
            padding: 10px 20px;
            border-bottom: 1px solid #2a2a2a;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header .logo { max-width: 60px; margin-bottom: 0; }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            background-color: #141414;
            padding: 10px;
            border-bottom: 1px solid #222;
        }

        .tab-btn {
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 20px;
            width: auto;
            font-size: 0.95em;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }

        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background-color: #121212;
            border-right: 1px solid #222;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px;
        }

        .cat-item {
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            color: #ccc;
            font-size: 0.9em;
            margin-bottom: 4px;
        }

        .cat-item:hover, .cat-item.active {
            background-color: #222;
            color: #007bff;
            font-weight: bold;
        }

        .media-grid {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .media-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
        }

        .media-card:hover { transform: scale(1.03); }

        .media-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background-color: #222;
            display: block;
        }

        .media-card .title {
            padding: 8px;
            font-size: 0.8em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* PLAYER OVERLAY */
        #playerModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-close {
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-suporte {
            position: fixed;
            bottom: calc(15px + env(safe-area-inset-bottom));
            right: calc(15px + env(safe-area-inset-right));
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            z-index: 999;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<!-- TELA DE LOGIN / ATIVAÇÃO -->
<div class="container layer-gpu" id="loginScreen">
    <img src="logo_gg.png" alt="Logo GG" class="logo" loading="eager" decoding="async">
    <h2>Acesso ao Player</h2>
    <p>Seu ID do dispositivo:</p>
    
    <div class="id-box">
        <span id="deviceId">Carregando...</span>
        <button class="btn-copy" id="btnCopiar">Copiar</button>
    </div>

    <button id="btnEntrar">Entrar</button>
    <div id="statusMsg" class="status-msg"></div>
</div>

<!-- TELA PRINCIPAL IPTV -->
<div id="mainScreen" class="hidden layer-gpu">
    <div class="header">
        <div class="header-left">
            <img src="logo_gg.png" alt="Logo GG" class="logo">
            <span style="font-weight: bold;">GG Player</span>
        </div>
        <span id="userInfo" style="font-size: 0.85em; color: #888;">ID Conectado</span>
    </div>

    <!-- ABAS PRINCIPAIS -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="carregarAba('sugestoes')">🔥 Sugestões</button>
        <button class="tab-btn" onclick="carregarAba('tv')">📺 TV ao Vivo</button>
        <button class="tab-btn" onclick="carregarAba('filmes')">🎬 Filmes</button>
        <button class="tab-btn" onclick="carregarAba('series')">🍿 Séries</button>
    </div>

    <div class="content-area">
        <div class="sidebar" id="categoryList"></div>
        <div class="media-grid" id="mediaGrid"></div>
    </div>
</div>

<!-- PLAYER OVERLAY -->
<div id="playerModal" class="hidden">
    <div class="player-header">
        <span id="playerTitle">Reproduzindo</span>
        <button class="btn-close" onclick="fecharPlayer()">✕</button>
    </div>
    <video id="mediaPlayer" controls playsinline webkit-playsinline preload="metadata"></video>
</div>

<a href="https://wa.me/5584998457394?text=Olá,%20preciso%20de%20suporte%20com%20o%20Web%20Player." target="_blank" class="btn-suporte layer-gpu">
    💬 Suporte
</a>

<script>
    'use strict';

    // ==========================================
    // CONFIGURAÇÃO DO FIREBASE
    // ==========================================
    // SUBSTIUA COM SUAS CREDENCIAIS DO FIREBASE
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_PROJECT_ID.firebaseapp.com",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_PROJECT_ID.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ==========================================
    // VARIÁVEIS DE ESTADO E CACHE
    // ==========================================
    let currentID = "";
    let activeServer = { dns: "", user: "", pass: "" };
    let hlsInstance = null;
    let abaAtual = 'sugestoes';

    const loginScreen = document.getElementById("loginScreen");
    const mainScreen = document.getElementById("mainScreen");
    const statusMsg = document.getElementById("statusMsg");
    const mediaPlayer = document.getElementById("mediaPlayer");
    const playerModal = document.getElementById("playerModal");

    // ==========================================
    // UTILS E REGRAS DE NEGÓCIO
    // ==========================================
    function isAdult(name) {
        if (!name) return false;
        const pattern = /(XXX|18\+|PORN|ADULTO|SEXX)/i;
        return pattern.test(name);
    }

    function formatUrl(url) {
        let clean = url.trim();
        if (!clean.startsWith('http://') && !clean.startsWith('https://')) {
            clean = 'http://' + clean;
        }
        return clean.replace(/\/$/, "");
    }

    // ==========================================
    // INDEXEDDB SERVICE
    // ==========================================
    function abrirDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open("GGPlayerCacheDB", 1);
            req.onupgradeneeded = e => {
                const database = e.target.result;
                if (!database.objectStoreNames.contains("cache")) {
                    database.createObjectStore("cache");
                }
            };
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e);
        });
    }

    async function setCache(key, val) {
        const idb = await abrirDB();
        const tx = idb.transaction("cache", "readwrite");
        tx.objectStore("cache").put(val, key);
    }

    async function getCache(key) {
        const idb = await abrirDB();
        return new Promise(resolve => {
            const tx = idb.transaction("cache", "readonly");
            const req = tx.objectStore("cache").get(key);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
        });
    }

    // ==========================================
    // 1. DADOS DE ACESSO & ID
    // ==========================================
    function obterIDLocal() { return localStorage.getItem("device_id"); }
    function salvarIDLocal(id) { localStorage.setItem("device_id", id); }

    function inicializarID() {
        currentID = obterIDLocal();
        if (!currentID) {
            currentID = "GG-" + Math.random().toString(36).substring(2, 9).toUpperCase();
            salvarIDLocal(currentID);
        }
        document.getElementById("deviceId").textContent = currentID;
    }

    // ==========================================
    // 3. HEALTH CHECK
    // ==========================================
    async function healthCheck(dns, user, pass) {
        try {
            const cleanDns = formatUrl(dns);
            const authUrl = `${cleanDns}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
            
            const res = await fetch(authUrl);
            if (!res.ok) return false;

            const json = await res.json();
            if (!json.user_info || json.user_info.auth !== 1 || json.user_info.status !== "Active") {
                return false;
            }

            // Deep Check
            const deepUrl = `${cleanDns}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_vod_categories`;
            const deepRes = await fetch(deepUrl);
            if (!deepRes.ok) return false;

            const deepJson = await deepRes.json();
            if (!Array.isArray(deepJson)) return false;

            return true;
        } catch (e) {
            return false;
        }
    }

    // ==========================================
    // 2. MODOS DE CONEXÃO
    // ==========================================
    async function iniciarConexao() {
        statusMsg.textContent = "Verificando autorização...";
        
        // 1. Consulta Firestore
        const docRef = db.collection("devices").doc(currentID);
        const docSnap = await docRef.get();

        if (!docSnap.exists) {
            // Cria o registro base no Firestore
            await docRef.set({ authorized: false, mode: "FIXED" }, { merge: true });
            statusMsg.textContent = "ID pendente de ativação no painel.";
            return;
        }

        const data = docSnap.data();

        if (!data.authorized) {
            statusMsg.textContent = "ID pendente de ativação.";
            return;
        }

        const mode = data.mode || "FIXED";
        const user = data.username || "";
        const pass = data.password || "";

        statusMsg.textContent = `Conectando via modo ${mode}...`;

        let dnsValido = null;

        // Modo FIXED
        if (mode === "FIXED") {
            const dns = formatUrl(data.fixed_url || "");
            if (await healthCheck(dns, user, pass)) {
                dnsValido = { dns, user, pass };
            }
        }
        // Modo DYNAMIC
        else if (mode === "DYNAMIC") {
            const configSnap = await db.collection("config").doc("global").get();
            if (configSnap.exists) {
                const dynamicUrl = configSnap.data().dynamic_dns_list_url;
                const txtRes = await fetch(dynamicUrl);
                const txtData = await txtRes.text();
                const dnsList = txtData.split("\n").map(l => l.trim()).filter(Boolean);

                for (const itemDns of dnsList) {
                    const formatted = formatUrl(itemDns);
                    if (await healthCheck(formatted, user, pass)) {
                        dnsValido = { dns: formatted, user, pass };
                        break;
                    }
                }
            }
        }
        // Modo BALANCE
        else if (mode === "BALANCE") {
            const balanceUrl = data.balance_url;
            const res = await fetch(balanceUrl);
            const text = await res.text();
            const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

            let bestLatency = Infinity;

            for (const line of lines) {
                const parts = line.split("|");
                if (parts.length >= 3) {
                    const h = formatUrl(parts[0]);
                    const u = parts[1];
                    const p = parts[2];

                    const start = performance.now();
                    const isOk = await healthCheck(h, u, p);
                    const latency = performance.now() - start;

                    if (isOk && latency < bestLatency) {
                        bestLatency = latency;
                        dnsValido = { dns: h, user: u, pass: p };
                    }
                }
            }

            if (dnsValido) {
                sessionStorage.setItem("balance_credentials", JSON.stringify(dnsValido));
            }
        }

        if (dnsValido) {
            activeServer = dnsValido;
            statusMsg.textContent = "Conexão estabelecida com sucesso!";
            loginScreen.classList.add("hidden");
            mainScreen.classList.remove("hidden");
            carregarAba('sugestoes');
        } else {
            statusMsg.textContent = "Falha ao conectar no servidor. Tente novamente mais tarde.";
        }
    }

    // ==========================================
    // 4. COLETA DE DADOS IPTV & NAVEGAÇÃO
    // ==========================================
    async function fetchApi(action, params = "") {
        const cacheKey = `${activeServer.dns}_${action}_${params}`;
        const cached = await getCache(cacheKey);
        if (cached) return cached;

        const url = `${activeServer.dns}/player_api.php?username=${encodeURIComponent(activeServer.user)}&password=${encodeURIComponent(activeServer.pass)}&action=${action}${params}`;
        const res = await fetch(url);
        const data = await res.json();

        await setCache(cacheKey, data);
        return data;
    }

    async function carregarAba(tipo) {
        abaAtual = tipo;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');

        const sidebar = document.getElementById("categoryList");
        const grid = document.getElementById("mediaGrid");
        sidebar.innerHTML = "";
        grid.innerHTML = "Carregando...";

        if (tipo === 'sugestoes') {
            const vods = await fetchApi("get_vod_streams");
            const series = await fetchApi("get_series");

            const misturados = [...(vods || []), ...(series || [])]
                .filter(i => !isAdult(i.name))
                .sort((a, b) => parseInt(b.stream_id || b.series_id || 0) - parseInt(a.stream_id || a.series_id || 0))
                .slice(0, 100);

            renderizarGrid(misturados);
            return;
        }

        let actionCat = "get_live_categories";
        if (tipo === "filmes") actionCat = "get_vod_categories";
        if (tipo === "series") actionCat = "get_series_categories";

        const categorias = await fetchApi(actionCat);
        sidebar.innerHTML = `<div class="cat-item active" onclick="filtrarCategoria('todas')">Todas as Categorias</div>`;
        
        (categorias || []).forEach(cat => {
            if (!isAdult(cat.category_name)) {
                sidebar.innerHTML += `<div class="cat-item" onclick="filtrarCategoria('${cat.category_id}')">${cat.category_name}</div>`;
            }
        });

        filtrarCategoria('todas');
    }

    async function filtrarCategoria(catId) {
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');

        let actionStream = "get_live_streams";
        if (abaAtual === "filmes") actionStream = "get_vod_streams";
        if (abaAtual === "series") actionStream = "get_series";

        let params = catId !== 'todas' ? `&category_id=${catId}` : "";
        const streams = await fetchApi(actionStream, params);
        
        const filtrados = (streams || []).filter(i => !isAdult(i.name));
        renderizarGrid(filtrados);
    }

    function renderizarGrid(itens) {
        const grid = document.getElementById("mediaGrid");
        grid.innerHTML = "";

        itens.forEach(item => {
            const title = item.name || "Sem Nome";
            const icon = item.stream_icon || item.cover || "https://via.placeholder.com/150x225?text=Sem+Capa";
            const id = item.stream_id || item.series_id;
            const ext = item.container_extension || "mp4";

            grid.innerHTML += `
                <div class="media-card" onclick="reproduzirMidia('${id}', '${abaAtual}', '${ext}', '${title.replace(/'/g, "\\'")}')">
                    <img src="${icon}" alt="${title}" loading="lazy">
                    <div class="title">${title}</div>
                </div>
            `;
        });
    }

    // ==========================================
    // 5. GERAÇÃO DE URL E STREAMING (HLS.JS / iOS)
    // ==========================================
    function reproduzirMidia(id, tipo, ext, titulo) {
        document.getElementById("playerTitle").textContent = titulo;
        
        let mediaUrl = "";
        const { dns, user, pass } = activeServer;

        if (tipo === "tv") {
            mediaUrl = `${dns}/live/${user}/${pass}/${id}.m3u8`;
        } else if (tipo === "filmes") {
            mediaUrl = `${dns}/movie/${user}/${pass}/${id}.${ext}`;
        } else if (tipo === "series") {
            mediaUrl = `${dns}/series/${user}/${pass}/${id}.${ext}`;
        } else {
            mediaUrl = `${dns}/movie/${user}/${pass}/${id}.${ext}`;
        }

        playerModal.classList.remove("hidden");

        // Tratamento HLS para canais ao vivo no iOS/Safari
        if (mediaUrl.endsWith(".m3u8")) {
            if (Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();

                hlsInstance = new Hls({
                    maxBufferLength: 30, // Buffer de 30 segundos conforme requisito
                    maxMaxBufferLength: 60
                });
                hlsInstance.loadSource(mediaUrl);
                hlsInstance.attachMedia(mediaPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => mediaPlayer.play());
            } else if (mediaPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                // Suporte nativo iOS Safari
                mediaPlayer.src = mediaUrl;
                mediaPlayer.play();
            }
        } else {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            mediaPlayer.src = mediaUrl;
            mediaPlayer.play();
        }
    }

    function fecharPlayer() {
        if (hlsInstance) {
            hlsInstance.destroy();
            hlsInstance = null;
        }
        mediaPlayer.pause();
        mediaPlayer.removeAttribute("src");
        playerModal.classList.add("hidden");
    }

    // ==========================================
    // INICIALIZAÇÃO E EVENTOS
    // ==========================================
    document.getElementById("btnCopiar").addEventListener("click", () => {
        navigator.clipboard.writeText(currentID).then(() => alert("ID copiado!"));
    });
    document.getElementById("btnEntrar").addEventListener("click", iniciarConexao);

    inicializarID();
</script>

</body>
</html>
