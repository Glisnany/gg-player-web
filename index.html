<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Player Web</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%; }
        .id-box { background: #2a2a2a; padding: 10px; border-radius: 5px; margin: 15px 0; font-family: monospace; }
        button { background: #007bff; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .hidden { display: none !important; }
        #mainScreen { width: 100%; height: 100vh; display: flex; flex-direction: column; background: #0d0d0d; }
        .nav-tabs { display: flex; justify-content: center; gap: 10px; padding: 10px; background: #141414; }
        .tab-btn { background: #222; color: #aaa; border: none; padding: 8px 16px; border-radius: 15px; cursor: pointer; }
        .tab-btn.active { background: #007bff; color: #fff; }
        .content { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 200px; background: #121212; overflow-y: auto; padding: 10px; }
        .cat-item { padding: 8px; cursor: pointer; color: #ccc; }
        .cat-item.active { color: #007bff; font-weight: bold; }
        .grid { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .card { background: #1a1a1a; border-radius: 5px; text-align: center; cursor: pointer; padding: 5px; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card .title { font-size: 0.8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #playerModal { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; }
        .player-head { padding: 10px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.7); }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div class="container" id="loginScreen">
    <h2>GG Player Web</h2>
    <p>Seu ID:</p>
    <div class="id-box" id="deviceId">Carregando...</div>
    <button id="btnEntrar">Entrar</button>
    <p id="statusMsg" style="color: #ff9800; font-size: 0.9em;"></p>
</div>

<div id="mainScreen" class="hidden">
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="carregarAba('tv')">📺 TV</button>
        <button class="tab-btn" onclick="carregarAba('filmes')">🎬 Filmes</button>
        <button class="tab-btn" onclick="carregarAba('series')">🍿 Séries</button>
    </div>
    <div class="content">
        <div class="sidebar" id="categoryList"></div>
        <div class="grid" id="mediaGrid"></div>
    </div>
</div>

<div id="playerModal" class="hidden">
    <div class="player-head">
        <span id="playerTitle"></span>
        <button onclick="fecharPlayer()" style="width:auto;">✕ Fechar</button>
    </div>
    <video id="mediaPlayer" controls></video>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC06Bn7C-llo0B0vIfE7Nxq5vkEhBk2U-w",
        authDomain: "gg-gestao.firebaseapp.com",
        projectId: "gg-gestao",
        storageBucket: "gg-gestao.firebasestorage.app",
        messagingSenderId: "499414114342",
        appId: "1:499414114342:web:8d8b9e4f89fff9179706e7"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentID = localStorage.getItem("device_id") || "GG-" + Math.random().toString(36).substring(2, 9).toUpperCase();
    localStorage.setItem("device_id", currentID);
    document.getElementById("deviceId").textContent = currentID;

    let playlist = { tv: [], filmes: [], series: [] };
    let abaAtual = 'tv';
    let hls = null;

    async function baixarLista(urlOriginal) {
        const proxies = [
            (url) => url, // Tentativa direta
            (url) => "https://corsproxy.io/?" + encodeURIComponent(url),
            (url) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
            (url) => "https://thingproxy.freeboard.io/fetch/" + url
        ];

        for (let i = 0; i < proxies.length; i++) {
            try {
                const urlFinal = proxies[i](urlOriginal);
                const res = await fetch(urlFinal);
                if (res.ok) {
                    const text = await res.text();
                    if (text.includes("#EXTM3U")) return text;
                }
            } catch (e) {
                console.warn(`Tentativa ${i + 1} falhou. Tentando próximo método...`);
            }
        }
        throw new Error("Todos os métodos de conexão falharam.");
    }

    document.getElementById("btnEntrar").onclick = async () => {
        const status = document.getElementById("statusMsg");
        status.textContent = "Conectando ao Firebase...";

        try {
            const doc = await db.collection("devices").doc(currentID).get();
            if (!doc.exists) return status.textContent = "ID não cadastrado no painel.";
            
            const data = doc.data();
            if (!data.authorized) return status.textContent = "Dispositivo não autorizado.";
            if (!data.fixed_url) return status.textContent = "Sem URL cadastrada.";

            status.textContent = "Baixando lista de canais...";
            
            const text = await baixarLista(data.fixed_url.trim());

            parseM3U(text);
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("mainScreen").classList.remove("hidden");
            carregarAba('tv');
        } catch (e) {
            status.textContent = "O servidor da lista bloqueou conexões Web (CORS).";
        }
    };

    function parseM3U(content) {
        playlist = { tv: [], filmes: [], series: [] };
        let item = null;
        content.split('\n').forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',')[1] || "Sem Nome";
                const logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || "";
                const group = (line.match(/group-title="([^"]+)"/) || [])[1] || "Geral";
                item = { name, logo, group };
            } else if (line.startsWith('http') && item) {
                item.url = line;
                const g = item.group.toUpperCase();
                if (g.includes("FILME") || line.includes("/movie/")) playlist.filmes.push(item);
                else if (g.includes("SERIE") || line.includes("/series/")) playlist.series.push(item);
                else playlist.tv.push(item);
                item = null;
            }
        });
    }

    function carregarAba(tipo) {
        abaAtual = tipo;
        const side = document.getElementById("categoryList");
        side.innerHTML = `<div class="cat-item active" onclick="filtrar('')">Todas</div>`;
        
        const grupos = [...new Set(playlist[tipo].map(i => i.group))];
        grupos.forEach(g => side.innerHTML += `<div class="cat-item" onclick="filtrar('${g}')">${g}</div>`);
        filtrar('');
    }

    function filtrar(grp) {
        const grid = document.getElementById("mediaGrid");
        grid.innerHTML = "";
        const lista = grp ? playlist[abaAtual].filter(i => i.group === grp) : playlist[abaAtual];
        
        lista.forEach(i => {
            grid.innerHTML += `
                <div class="card" onclick="play('${i.url}', '${i.name}')">
                    <img src="${i.logo || 'https://via.placeholder.com/120x150'}">
                    <div class="title">${i.name}</div>
                </div>`;
        });
    }

    function play(url, titulo) {
        document.getElementById("playerTitle").textContent = titulo;
        document.getElementById("playerModal").classList.remove("hidden");
        const video = document.getElementById("mediaPlayer");

        if (Hls.isSupported() && url.includes(".m3u8")) {
            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = url;
            video.play();
        }
    }

    function fecharPlayer() {
        if (hls) hls.destroy();
        const video = document.getElementById("mediaPlayer");
        video.pause();
        document.getElementById("playerModal").classList.add("hidden");
    }
</script>
</body>
</html>
