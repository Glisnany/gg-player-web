<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Player Web</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%; }
        .id-box { background: #2a2a2a; padding: 10px; border-radius: 5px; margin: 15px 0; font-family: monospace; }
        button { background: #007bff; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .hidden { display: none !important; }
        #mainScreen { width: 100%; height: 100vh; display: flex; flex-direction: column; background: #0d0d0d; }
        .nav-tabs { display: flex; justify-content: center; gap: 10px; padding: 10px; background: #141414; }
        .tab-btn { background: #222; color: #aaa; border: none; padding: 8px 16px; border-radius: 15px; cursor: pointer; }
        .tab-btn.active { background: #007bff; color: #fff; }
        .content { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 240px; background: #121212; overflow-y: auto; padding: 10px; border-right: 1px solid #222; }
        .cat-item { padding: 10px; cursor: pointer; color: #ccc; border-bottom: 1px solid #1a1a1a; font-size: 0.85em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat-item.active { color: #007bff; font-weight: bold; background: #1a1a1a; border-left: 3px solid #007bff; }
        .grid { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; align-content: start; }
        .card { background: #1a1a1a; border-radius: 5px; text-align: center; cursor: pointer; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .card img { width: 100%; height: 130px; object-fit: contain; border-radius: 4px; background: #000; }
        .card .title { font-size: 0.8em; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; height: 2.4em; }
        #playerModal { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; }
        .player-head { padding: 10px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); align-items: center; }
        video { width: 100%; height: 100%; }
        .debug-info { font-size: 0.8em; color: #888; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>

<div class="container" id="loginScreen">
    <h2>GG Player Web</h2>
    <p>Seu ID:</p>
    <div class="id-box" id="deviceId">Carregando...</div>
    <button id="btnEntrar">Entrar</button>
    <p id="statusMsg" style="color: #ff9800; font-size: 0.9em; margin-top: 15px;"></p>
    <div id="debugInfo" class="debug-info"></div>
</div>

<div id="mainScreen" class="hidden">
    <div class="nav-tabs">
        <button class="tab-btn active" id="btn-tv" onclick="carregarAba('tv')">📺 TV</button>
        <button class="tab-btn" id="btn-filmes" onclick="carregarAba('filmes')">🎬 Filmes</button>
        <button class="tab-btn" id="btn-series" onclick="carregarAba('series')">🍿 Séries</button>
    </div>
    <div class="content">
        <div class="sidebar" id="categoryList"></div>
        <div class="grid" id="mediaGrid"></div>
    </div>
</div>

<div id="playerModal" class="hidden">
    <div class="player-head">
        <span id="playerTitle" style="font-weight: bold; font-size: 0.9em;"></span>
        <button onclick="fecharPlayer()" style="width:auto; padding: 5px 15px;">✕ Fechar</button>
    </div>
    <video id="mediaPlayer" controls autoplay></video>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC06Bn7C-llo0B0vIfE7Nxq5vkEhBk2U-w",
        authDomain: "gg-gestao.firebaseapp.com",
        projectId: "gg-gestao",
        storageBucket: "gg-gestao.firebasestorage.app",
        messagingSenderId: "499414114342",
        appId: "1:499414114342:web:8d8b9e4f89fff9179706e7"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentID = localStorage.getItem("device_id") || "GG-" + Math.random().toString(36).substring(2, 9).toUpperCase();
    localStorage.setItem("device_id", currentID);
    document.getElementById("deviceId").textContent = currentID;

    let playlist = { tv: [], filmes: [], series: [] };
    let abaAtual = 'tv';
    let hls = null;

    document.getElementById("btnEntrar").onclick = async () => {
        const status = document.getElementById("statusMsg");
        const debug = document.getElementById("debugInfo");
        status.textContent = "Conectando ao Firebase...";
        debug.textContent = "";

        try {
            const doc = await db.collection("devices").doc(currentID).get();
            if (!doc.exists) return status.textContent = "ID não cadastrado no painel.";
            
            const data = doc.data();
            if (!data.authorized) return status.textContent = "Dispositivo não autorizado.";
            if (!data.fixed_url) return status.textContent = "Sem URL cadastrada no Firestore.";

            status.textContent = "Baixando lista de canais via proxy...";
            
            const linkProxy = "proxy.php?url=" + encodeURIComponent(data.fixed_url.trim());
            
            const res = await fetch(linkProxy);
            if (!res.ok) {
                const errTxt = await res.text();
                throw new Error(errTxt || "Falha ao consultar proxy.php");
            }
            
            const text = await res.text();

            if (!text || text.trim().length === 0) {
                throw new Error("O servidor retornou um arquivo M3U vazio.");
            }

            status.textContent = "Processando canais e categorias...";
            const totalCarregado = parseM3U(text);

            if (totalCarregado === 0) {
                throw new Error("O arquivo baixado não contém canais em formato M3U válido.");
            }

            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("mainScreen").classList.remove("hidden");
            carregarAba('tv');
        } catch (e) {
            status.textContent = "Erro ao carregar lista.";
            debug.textContent = e.message;
        }
    };

    function parseM3U(content) {
        playlist = { tv: [], filmes: [], series: [] };
        
        // Normaliza quebras de linha de qualquer SO
        const lines = content.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        
        let tempItem = { name: "", logo: "", group: "Geral" };
        let totalCount = 0;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            if (line.startsWith('#EXTINF:')) {
                // Nome do canal
                const commaIdx = line.lastIndexOf(',');
                tempItem.name = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : "Sem Nome";

                // Logotipo
                const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                tempItem.logo = logoMatch ? logoMatch[1] : "";

                // Categoria principal (group-title)
                const groupMatch = line.match(/group-title="([^"]+)"/i);
                if (groupMatch && groupMatch[1].trim()) {
                    tempItem.group = groupMatch[1].trim();
                }

            } else if (line.startsWith('#EXTGRP:')) {
                // Fallback para tag #EXTGRP
                const grp = line.replace('#EXTGRP:', '').trim();
                if (grp) tempItem.group = grp;

            } else if (line.startsWith('http://') || line.startsWith('https://')) {
                const item = {
                    name: tempItem.name || "Canal sem nome",
                    logo: tempItem.logo || "",
                    group: tempItem.group || "Geral",
                    url: line
                };

                const gUpper = item.group.toUpperCase();
                const uLower = line.toLowerCase();

                // Classificação blindada
                if (gUpper.includes("FILME") || gUpper.includes("VOD") || uLower.includes("/movie/")) {
                    playlist.filmes.push(item);
                } else if (gUpper.includes("SERIE") || uLower.includes("/series/")) {
                    playlist.series.push(item);
                } else {
                    // Por padrão, se não tem certeza, joga para TV para NUNCA sumir
                    playlist.tv.push(item);
                }

                totalCount++;
                // Reseta tempItem com valores padrão
                tempItem = { name: "", logo: "", group: "Geral" };
            }
        }

        return totalCount;
    }

    function carregarAba(tipo) {
        abaAtual = tipo;
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${tipo}`).classList.add('active');

        const side = document.getElementById("categoryList");
        side.innerHTML = "";

        // Botão Todas
        const allBtn = document.createElement("div");
        allBtn.className = "cat-item active";
        allBtn.textContent = `Todas (${playlist[tipo].length})`;
        allBtn.onclick = () => {
            document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
            allBtn.classList.add('active');
            filtrar('');
        };
        side.appendChild(allBtn);

        // Extrai categorias sem duplicações
        const grupos = [...new Set(playlist[tipo].map(i => i.group))].sort();
        
        grupos.forEach(g => {
            const qtd = playlist[tipo].filter(i => i.group === g).length;
            const catBtn = document.createElement("div");
            catBtn.className = "cat-item";
            catBtn.textContent = `${g} (${qtd})`;
            catBtn.onclick = () => {
                document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
                catBtn.classList.add('active');
                filtrar(g);
            };
            side.appendChild(catBtn);
        });

        filtrar('');
    }

    function filtrar(grp) {
        const grid = document.getElementById("mediaGrid");
        grid.innerHTML = "";
        
        const lista = grp ? playlist[abaAtual].filter(i => i.group === grp) : playlist[abaAtual];
        
        if (lista.length === 0) {
            grid.innerHTML = `<div style='grid-column: 1/-1; text-align: center; color: #888; padding: 40px;'>
                <p>Nenhum item disponível nesta aba no momento.</p>
                <p style="font-size:0.8em; color:#555;">Tente alternar entre as abas TV, Filmes ou Séries no topo.</p>
            </div>`;
            return;
        }

        const fragment = document.createDocumentFragment();

        lista.forEach(i => {
            const card = document.createElement("div");
            card.className = "card";
            
            const img = document.createElement("img");
            img.src = i.logo || 'https://via.placeholder.com/130x130/1a1a1a/888888?text=Sem+Capa';
            img.onerror = () => { img.src = 'https://via.placeholder.com/130x130/1a1a1a/888888?text=Sem+Capa'; };
            
            const title = document.createElement("div");
            title.className = "title";
            title.textContent = i.name;

            card.appendChild(img);
            card.appendChild(title);
            card.onclick = () => play(i.url, i.name);

            fragment.appendChild(card);
        });

        grid.appendChild(fragment);
    }

    function play(url, titulo) {
        document.getElementById("playerTitle").textContent = titulo;
        document.getElementById("playerModal").classList.remove("hidden");
        const video = document.getElementById("mediaPlayer");

        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play().catch(() => {});
        } else if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        } else {
            video.src = url;
            video.play().catch(() => {});
        }
    }

    function fecharPlayer() {
        if (hls) {
            hls.destroy();
            hls = null;
        }
        const video = document.getElementById("mediaPlayer");
        video.pause();
        video.src = "";
        document.getElementById("playerModal").classList.add("hidden");
    }
</script>
</body>
</html>
